<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma Bibliothèque Locale</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2.5em;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .stat-item {
            background: #f0f0f0;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.9em;
            color: #666;
        }

        .stat-item strong {
            color: #667eea;
            font-size: 1.2em;
        }

        .controls {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .search-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .search-bar input {
            flex: 1;
            min-width: 250px;
            padding: 12px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .search-bar input:focus {
            outline: none;
            border-color: #667eea;
        }

        .filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-group label {
            color: #666;
            font-size: 0.9em;
            font-weight: 500;
        }

        .filter-group select {
            padding: 8px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            background: white;
            cursor: pointer;
        }

        .view-toggle {
            display: flex;
            gap: 5px;
            background: #f0f0f0;
            padding: 5px;
            border-radius: 8px;
        }

        .view-toggle button {
            padding: 8px 15px;
            border: none;
            background: transparent;
            cursor: pointer;
            border-radius: 5px;
            font-size: 14px;
            transition: background 0.3s;
        }

        .view-toggle button.active {
            background: white;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .books-container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            min-height: 400px;
        }

        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 25px;
        }

        .books-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .book-card {
            background: white;
            border: 2px solid #f0f0f0;
            border-radius: 12px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
        }

        .book-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            border-color: #667eea;
        }

        .book-cover {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 3em;
        }

        .book-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
        }

        .book-info {
            flex: 1;
        }

        .book-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
            font-size: 1em;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .book-author {
            color: #666;
            font-size: 0.85em;
            margin-bottom: 8px;
        }

        .book-meta {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            font-size: 0.75em;
            color: #999;
            margin-bottom: 8px;
        }

        .book-categories {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .category-tag {
            background: #667eea;
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75em;
        }

        .add-category-btn {
            background: #f0f0f0;
            color: #666;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75em;
            border: none;
            cursor: pointer;
            transition: background 0.3s;
        }

        .add-category-btn:hover {
            background: #e0e0e0;
        }

        /* Vue liste */
        .books-list .book-card {
            flex-direction: row;
            gap: 20px;
        }

        .books-list .book-cover {
            width: 120px;
            height: 160px;
            flex-shrink: 0;
        }

        .books-list .book-info {
            flex: 1;
        }

        .no-books {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .no-books h2 {
            margin-bottom: 10px;
            color: #666;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #667eea;
            font-size: 1.2em;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            color: #333;
            flex: 1;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 2em;
            cursor: pointer;
            color: #999;
            line-height: 1;
        }

        .close-btn:hover {
            color: #333;
        }

        .modal-body {
            display: flex;
            gap: 20px;
        }

        .modal-cover {
            width: 200px;
            height: 266px;
            flex-shrink: 0;
        }

        .modal-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
        }

        .modal-info {
            flex: 1;
        }

        .modal-info p {
            margin-bottom: 12px;
            line-height: 1.6;
        }

        .modal-info strong {
            color: #667eea;
        }

        .category-input {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .category-input input {
            flex: 1;
            padding: 8px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
        }

        .category-input button {
            padding: 8px 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .category-input button:hover {
            background: #5568d3;
        }

        .open-file-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 24px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            transition: background 0.3s;
        }

        .open-file-btn:hover {
            background: #5568d3;
        }

        .error-message {
            background: #ffe6e6;
            color: #d32f2f;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .books-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 15px;
            }

            .modal-body {
                flex-direction: column;
            }

            .modal-cover {
                width: 100%;
                height: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 Ma Bibliothèque Locale</h1>
            <div class="stats">
                <div class="stat-item">
                    <strong id="total-books">0</strong> livres
                </div>
                <div class="stat-item">
                    <strong id="total-authors">0</strong> auteurs
                </div>
                <div class="stat-item">
                    Dernière analyse: <strong id="scan-date">-</strong>
                </div>
            </div>
        </header>

        <div class="controls">
            <div class="search-bar">
                <input
                    type="text"
                    id="search-input"
                    placeholder="🔍 Rechercher par titre, auteur, ou mot-clé..."
                >
                <div class="view-toggle">
                    <button id="grid-view" class="active">Grille</button>
                    <button id="list-view">Liste</button>
                </div>
            </div>
            <div class="filters">
                <div class="filter-group">
                    <label>Auteur:</label>
                    <select id="author-filter">
                        <option value="">Tous les auteurs</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Catégorie:</label>
                    <select id="category-filter">
                        <option value="">Toutes les catégories</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Type:</label>
                    <select id="type-filter">
                        <option value="">Tous les types</option>
                        <option value="pdf">PDF</option>
                        <option value="epub">ePub</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="books-container">
            <div id="books-display" class="books-grid">
                <div class="loading">Chargement de votre bibliothèque...</div>
            </div>
        </div>
    </div>

    <!-- Modal pour les détails du livre -->
    <div id="book-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title"></h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="modal-cover" id="modal-cover-container"></div>
                <div class="modal-info" id="modal-info"></div>
            </div>
        </div>
    </div>

    <script>
        let library = null;
        let filteredBooks = [];
        let currentView = 'grid';

        // Charger la bibliothèque au démarrage
        async function loadLibrary() {
            try {
                console.log('Chargement de la bibliothèque...');
                const response = await fetch('library_data/library.json');
                console.log('Response status:', response.status);
                console.log('Response headers:', response.headers);

                if (!response.ok) {
                    throw new Error(`Fichier library.json introuvable (status: ${response.status})`);
                }

                // Récupérer le texte brut d'abord
                const text = await response.text();
                console.log('Taille du texte reçu:', text.length, 'caractères');
                console.log('Premiers 100 caractères:', text.substring(0, 100));
                console.log('Derniers 100 caractères:', text.substring(text.length - 100));

                // Parser le JSON
                library = JSON.parse(text);
                console.log('JSON parsé avec succès!', library.total_books, 'livres');

                filteredBooks = library.books;

                updateStats();
                populateFilters();
                displayBooks();
            } catch (error) {
                console.error('Erreur de chargement:', error);
                console.error('Stack trace:', error.stack);
                document.getElementById('books-display').innerHTML = `
                    <div class="error-message">
                        <h2>❌ Erreur de chargement</h2>
                        <p><strong>Erreur:</strong> ${error.message}</p>
                        <p>Impossible de charger la bibliothèque. Vérifiez que :</p>
                        <ul style="text-align: left; margin: 10px 0;">
                            <li>Vous utilisez <strong>http://localhost:8000</strong> et PAS file://</li>
                            <li>Le serveur HTTP est bien démarré : <code>python3 -m http.server 8000</code></li>
                            <li>Le fichier library_data/library.json existe et est valide</li>
                        </ul>
                        <p><strong>Commande pour rescanner:</strong> python3 scanner.py /chemin/vers/vos/livres</p>
                    </div>
                `;
            }
        }

        // Mettre à jour les statistiques
        function updateStats() {
            document.getElementById('total-books').textContent = library.total_books;

            const authors = new Set(library.books.map(book => book.author));
            document.getElementById('total-authors').textContent = authors.size;

            const scanDate = new Date(library.scan_date);
            document.getElementById('scan-date').textContent = scanDate.toLocaleDateString('fr-FR');
        }

        // Remplir les filtres
        function populateFilters() {
            // Auteurs
            const authors = [...new Set(library.books.map(book => book.author))].sort();
            const authorSelect = document.getElementById('author-filter');
            authors.forEach(author => {
                const option = document.createElement('option');
                option.value = author;
                option.textContent = author;
                authorSelect.appendChild(option);
            });

            // Catégories
            const categories = new Set();
            library.books.forEach(book => {
                book.categories.forEach(cat => categories.add(cat));
            });
            const categorySelect = document.getElementById('category-filter');
            [...categories].sort().forEach(category => {
                const option = document.createElement('option');
                option.value = category;
                option.textContent = category;
                categorySelect.appendChild(option);
            });
        }

        // Afficher les livres
        function displayBooks() {
            const container = document.getElementById('books-display');
            container.className = currentView === 'grid' ? 'books-grid' : 'books-list';

            if (filteredBooks.length === 0) {
                container.innerHTML = `
                    <div class="no-books">
                        <h2>Aucun livre trouvé</h2>
                        <p>Essayez de modifier vos filtres de recherche</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filteredBooks.map(book => createBookCard(book)).join('');
        }

        // Créer une carte de livre
        function createBookCard(book) {
            const coverHtml = book.cover
                ? `<img src="library_data/${book.cover}" alt="${book.title}">`
                : `<div style="font-size: 3em;">📖</div>`;

            const fileSize = formatFileSize(book.size);
            const pagesInfo = book.pages ? `${book.pages} pages` : 'ePub';

            const categoriesTags = book.categories.map(cat =>
                `<span class="category-tag">${cat}</span>`
            ).join('');

            return `
                <div class="book-card" onclick="openBookModal('${book.id}')">
                    <div class="book-cover">${coverHtml}</div>
                    <div class="book-info">
                        <div class="book-title">${book.title}</div>
                        <div class="book-author">${book.author}</div>
                        <div class="book-meta">
                            <span>${book.type.toUpperCase()}</span>
                            <span>${pagesInfo}</span>
                            <span>${fileSize}</span>
                        </div>
                        <div class="book-categories">
                            ${categoriesTags}
                            ${book.categories.length === 0 ? '<button class="add-category-btn" onclick="event.stopPropagation(); openBookModal(\'' + book.id + '\')">+ Ajouter catégorie</button>' : ''}
                        </div>
                    </div>
                </div>
            `;
        }

        // Formater la taille de fichier
        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        // Ouvrir la modal de détails
        function openBookModal(bookId) {
            const book = library.books.find(b => b.id === bookId);
            if (!book) return;

            const modal = document.getElementById('book-modal');
            document.getElementById('modal-title').textContent = book.title;

            const coverHtml = book.cover
                ? `<img src="library_data/${book.cover}" alt="${book.title}">`
                : `<div class="book-cover"><div style="font-size: 4em;">📖</div></div>`;

            document.getElementById('modal-cover-container').innerHTML = coverHtml;

            const categoriesTags = book.categories.map((cat, idx) =>
                `<span class="category-tag">${cat} <span style="cursor: pointer; margin-left: 5px;" onclick="removeCategory('${bookId}', ${idx})">×</span></span>`
            ).join('');

            document.getElementById('modal-info').innerHTML = `
                <p><strong>Auteur:</strong> ${book.author}</p>
                <p><strong>Type:</strong> ${book.type.toUpperCase()}</p>
                <p><strong>Pages:</strong> ${book.pages || 'N/A'}</p>
                <p><strong>Taille:</strong> ${formatFileSize(book.size)}</p>
                <p><strong>Fichier:</strong> ${book.filename}</p>
                <p><strong>Modifié:</strong> ${new Date(book.modified).toLocaleDateString('fr-FR')}</p>
                <p><strong>Catégories:</strong></p>
                <div class="book-categories" style="margin-bottom: 10px;">
                    ${categoriesTags}
                </div>
                <div class="category-input">
                    <input type="text" id="new-category-input" placeholder="Ajouter une catégorie...">
                    <button onclick="addCategory('${bookId}')">Ajouter</button>
                </div>
                <a href="file://${book.path}" class="open-file-btn" target="_blank">📖 Ouvrir le livre</a>
            `;

            modal.classList.add('active');
        }

        // Fermer la modal
        function closeModal() {
            document.getElementById('book-modal').classList.remove('active');
        }

        // Ajouter une catégorie
        function addCategory(bookId) {
            const input = document.getElementById('new-category-input');
            const category = input.value.trim();

            if (!category) return;

            const book = library.books.find(b => b.id === bookId);
            if (!book.categories.includes(category)) {
                book.categories.push(category);
                saveLibrary();
                openBookModal(bookId); // Rafraîchir la modal
                displayBooks(); // Rafraîchir l'affichage
                populateFilters(); // Rafraîchir les filtres
            }

            input.value = '';
        }

        // Supprimer une catégorie
        function removeCategory(bookId, categoryIndex) {
            const book = library.books.find(b => b.id === bookId);
            book.categories.splice(categoryIndex, 1);
            saveLibrary();
            openBookModal(bookId);
            displayBooks();
            populateFilters();
        }

        // Sauvegarder la bibliothèque
        function saveLibrary() {
            // Note: Dans un navigateur, on ne peut pas écrire directement dans un fichier
            // On utilise localStorage comme solution de contournement
            localStorage.setItem('library', JSON.stringify(library));
            console.log('Bibliothèque sauvegardée dans localStorage');
        }

        // Charger depuis localStorage si disponible
        function loadFromLocalStorage() {
            const saved = localStorage.getItem('library');
            if (saved) {
                try {
                    const savedLibrary = JSON.parse(saved);
                    // Fusionner les catégories sauvegardées avec les données actuelles
                    if (library) {
                        library.books.forEach(book => {
                            const savedBook = savedLibrary.books.find(b => b.id === book.id);
                            if (savedBook && savedBook.categories) {
                                book.categories = savedBook.categories;
                            }
                        });
                    }
                } catch (e) {
                    console.error('Erreur de chargement localStorage:', e);
                }
            }
        }

        // Recherche et filtrage
        function applyFilters() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const authorFilter = document.getElementById('author-filter').value;
            const categoryFilter = document.getElementById('category-filter').value;
            const typeFilter = document.getElementById('type-filter').value;

            filteredBooks = library.books.filter(book => {
                const matchSearch = !searchTerm ||
                    book.title.toLowerCase().includes(searchTerm) ||
                    book.author.toLowerCase().includes(searchTerm) ||
                    book.filename.toLowerCase().includes(searchTerm);

                const matchAuthor = !authorFilter || book.author === authorFilter;
                const matchCategory = !categoryFilter || book.categories.includes(categoryFilter);
                const matchType = !typeFilter || book.type === typeFilter;

                return matchSearch && matchAuthor && matchCategory && matchType;
            });

            displayBooks();
        }

        // Event listeners
        document.getElementById('search-input').addEventListener('input', applyFilters);
        document.getElementById('author-filter').addEventListener('change', applyFilters);
        document.getElementById('category-filter').addEventListener('change', applyFilters);
        document.getElementById('type-filter').addEventListener('change', applyFilters);

        document.getElementById('grid-view').addEventListener('click', () => {
            currentView = 'grid';
            document.getElementById('grid-view').classList.add('active');
            document.getElementById('list-view').classList.remove('active');
            displayBooks();
        });

        document.getElementById('list-view').addEventListener('click', () => {
            currentView = 'list';
            document.getElementById('list-view').classList.add('active');
            document.getElementById('grid-view').classList.remove('active');
            displayBooks();
        });

        // Fermer la modal en cliquant à l'extérieur
        document.getElementById('book-modal').addEventListener('click', (e) => {
            if (e.target.id === 'book-modal') {
                closeModal();
            }
        });

        // Charger la bibliothèque au démarrage
        loadLibrary().then(() => {
            loadFromLocalStorage();
            displayBooks();
        });
    </script>
</body>
</html>
