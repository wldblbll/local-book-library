<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma Bibliothèque Locale</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2.5em;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .stat-item {
            background: #f0f0f0;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.9em;
            color: #666;
        }

        .stat-item strong {
            color: #667eea;
            font-size: 1.2em;
        }

        .controls {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .search-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .search-bar input {
            flex: 1;
            min-width: 250px;
            padding: 12px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .search-bar input:focus {
            outline: none;
            border-color: #667eea;
        }

        .filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-group label {
            color: #666;
            font-size: 0.9em;
            font-weight: 500;
        }

        .filter-group select {
            padding: 8px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            background: white;
            cursor: pointer;
        }

        .view-toggle {
            display: flex;
            gap: 5px;
            background: #f0f0f0;
            padding: 5px;
            border-radius: 8px;
        }

        .view-toggle button {
            padding: 8px 15px;
            border: none;
            background: transparent;
            cursor: pointer;
            border-radius: 5px;
            font-size: 14px;
            transition: background 0.3s;
        }

        .view-toggle button.active {
            background: white;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .books-container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            min-height: 400px;
        }

        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 25px;
        }

        .books-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .book-card {
            background: white;
            border: 2px solid #f0f0f0;
            border-radius: 12px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
        }

        .book-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            border-color: #667eea;
        }

        .book-cover {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 3em;
        }

        .book-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
        }

        .book-info {
            flex: 1;
        }

        .book-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
            font-size: 1em;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .book-author {
            color: #666;
            font-size: 0.85em;
            margin-bottom: 8px;
        }

        .book-meta {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            font-size: 0.75em;
            color: #999;
            margin-bottom: 8px;
        }

        .book-categories {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .category-tag {
            /* background généré dynamiquement via getCategoryColor() */
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75em;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        }

        .add-category-btn {
            background: #f0f0f0;
            color: #666;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75em;
            border: none;
            cursor: pointer;
            transition: background 0.3s;
        }

        .add-category-btn:hover {
            background: #e0e0e0;
        }

        /* Vue liste - Tableau compact */
        .books-list {
            display: table;
            width: 100%;
            border-collapse: collapse;
        }

        .books-list .book-card {
            display: table-row;
            border-radius: 0;
            padding: 0;
            border: none;
            border-bottom: 1px solid #e0e0e0;
        }

        .books-list .book-card:hover {
            transform: none;
            background: #f8f8f8;
            box-shadow: none;
        }

        .books-list .book-card > div {
            display: table-cell;
            padding: 12px 10px;
            vertical-align: middle;
        }

        .books-list .book-cover {
            display: none !important;
        }

        .books-list .book-title {
            font-weight: 600;
            color: #333;
            margin: 0;
            display: block;
            -webkit-line-clamp: unset;
            overflow: visible;
        }

        .books-list .book-author {
            margin: 0;
            padding-left: 10px;
            min-width: 200px;
        }

        .books-list .book-meta {
            margin: 0;
            padding-left: 10px;
            min-width: 150px;
            white-space: nowrap;
        }

        .books-list .book-categories {
            margin: 0;
            padding-left: 10px;
        }

        /* Vue catégories */
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .category-card {
            background: white;
            border: 2px solid #f0f0f0;
            border-radius: 12px;
            padding: 0;
            cursor: pointer;
            transition: all 0.3s;
            overflow: hidden;
        }

        .category-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            border-color: #667eea;
        }

        .category-color-bar {
            height: 8px;
            width: 100%;
        }

        .category-name {
            padding: 20px 20px 10px 20px;
            font-size: 1.3em;
            font-weight: 600;
            color: #333;
        }

        .category-count {
            padding: 0 20px 20px 20px;
            color: #667eea;
            font-size: 1.1em;
            font-weight: 500;
        }

        /* Système de notation par étoiles */
        .star-rating {
            display: inline-flex;
            gap: 3px;
            cursor: pointer;
            font-size: 1.2em;
        }

        .star-rating .star {
            color: #ddd;
            transition: color 0.2s;
        }

        .star-rating .star.filled {
            color: #ffc107;
        }

        .star-rating .star:hover {
            color: #ffc107;
        }

        .star-rating-display {
            display: inline-flex;
            gap: 2px;
            font-size: 0.9em;
            margin-top: 5px;
        }

        .star-rating-display .star {
            color: #ddd;
        }

        .star-rating-display .star.filled {
            color: #ffc107;
        }

        .no-books {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .no-books h2 {
            margin-bottom: 10px;
            color: #666;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #667eea;
            font-size: 1.2em;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            color: #333;
            flex: 1;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 2em;
            cursor: pointer;
            color: #999;
            line-height: 1;
        }

        .close-btn:hover {
            color: #333;
        }

        .modal-body {
            display: flex;
            gap: 20px;
        }

        .modal-cover {
            width: 200px;
            height: 266px;
            flex-shrink: 0;
        }

        .modal-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
        }

        .modal-info {
            flex: 1;
        }

        .modal-info p {
            margin-bottom: 12px;
            line-height: 1.6;
        }

        .modal-info strong {
            color: #667eea;
        }

        .category-input {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .category-input input {
            flex: 1;
            padding: 8px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
        }

        .category-input button {
            padding: 8px 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .category-input button:hover {
            background: #5568d3;
        }

        /* Boutons d'action dans la modal */
        .modal-info button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.3s;
        }

        .modal-info button:hover {
            background: #5568d3;
        }

        .error-message {
            background: #ffe6e6;
            color: #d32f2f;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .books-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 15px;
            }

            .modal-body {
                flex-direction: column;
            }

            .modal-cover {
                width: 100%;
                height: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 Ma Bibliothèque Locale</h1>
            <div class="stats">
                <div class="stat-item">
                    <strong id="total-books">0</strong> livres
                </div>
                <div class="stat-item">
                    <strong id="total-authors">0</strong> auteurs
                </div>
                <div class="stat-item">
                    Dernière analyse: <strong id="scan-date">-</strong>
                </div>
            </div>
        </header>

        <!-- Rappel pour exporter les catégories -->
        <div id="export-reminder" style="display: none; opacity: 0; transition: opacity 0.3s; background: #fff3cd; border: 2px solid #ffc107; border-radius: 10px; padding: 15px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
            <div style="display: flex; align-items: center; justify-content: space-between;">
                <div style="flex: 1;">
                    <strong style="color: #856404;">💾 Modifications non sauvegardées</strong>
                    <p style="margin: 5px 0 0 0; color: #856404; font-size: 0.9em;">
                        Vos catégories sont sauvegardées dans le navigateur. Pour les enregistrer définitivement dans library.json :
                    </p>
                </div>
                <button onclick="exportCategories()" style="background: #ffc107; color: #000; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-left: 15px;">
                    📥 Exporter les catégories
                </button>
            </div>
        </div>

        <div class="controls">
            <div class="search-bar">
                <input
                    type="text"
                    id="search-input"
                    placeholder="🔍 Rechercher par titre, auteur, ou mot-clé..."
                >
                <div class="view-toggle">
                    <button id="grid-view" class="active">Grille</button>
                    <button id="list-view">Liste</button>
                    <button id="categories-view">Catégories</button>
                </div>
            </div>
            <div class="filters">
                <div class="filter-group">
                    <label>Auteur:</label>
                    <select id="author-filter">
                        <option value="">Tous les auteurs</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Catégorie:</label>
                    <select id="category-filter">
                        <option value="">Toutes les catégories</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Type:</label>
                    <select id="type-filter">
                        <option value="">Tous les types</option>
                        <option value="pdf">PDF</option>
                        <option value="epub">ePub</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Note:</label>
                    <select id="rating-filter">
                        <option value="">Toutes les notes</option>
                        <option value="5">⭐⭐⭐⭐⭐ (5 étoiles)</option>
                        <option value="4">⭐⭐⭐⭐ (4+)</option>
                        <option value="3">⭐⭐⭐ (3+)</option>
                        <option value="2">⭐⭐ (2+)</option>
                        <option value="1">⭐ (1+)</option>
                        <option value="0">Sans note</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="books-container">
            <div id="books-display" class="books-grid">
                <div class="loading">Chargement de votre bibliothèque...</div>
            </div>
        </div>
    </div>

    <!-- Modal pour les détails du livre -->
    <div id="book-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title"></h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="modal-cover" id="modal-cover-container"></div>
                <div class="modal-info" id="modal-info"></div>
            </div>
        </div>
    </div>

    <script>
        let library = null;
        let filteredBooks = [];
        let currentView = 'grid';

        // Charger la bibliothèque au démarrage
        async function loadLibrary() {
            try {
                console.log('Chargement de la bibliothèque...');
                const response = await fetch('library_data/library.json');
                console.log('Response status:', response.status);
                console.log('Response headers:', response.headers);

                if (!response.ok) {
                    throw new Error(`Fichier library.json introuvable (status: ${response.status})`);
                }

                // Récupérer le texte brut d'abord
                const text = await response.text();
                console.log('Taille du texte reçu:', text.length, 'caractères');
                console.log('Premiers 100 caractères:', text.substring(0, 100));
                console.log('Derniers 100 caractères:', text.substring(text.length - 100));

                // Parser le JSON
                library = JSON.parse(text);
                console.log('JSON parsé avec succès!', library.total_books, 'livres');

                filteredBooks = library.books;

                updateStats();
                populateFilters();
                displayBooks();
            } catch (error) {
                console.error('Erreur de chargement:', error);
                console.error('Stack trace:', error.stack);
                document.getElementById('books-display').innerHTML = `
                    <div class="error-message">
                        <h2>❌ Erreur de chargement</h2>
                        <p><strong>Erreur:</strong> ${error.message}</p>
                        <p>Impossible de charger la bibliothèque. Vérifiez que :</p>
                        <ul style="text-align: left; margin: 10px 0;">
                            <li>Vous utilisez <strong>http://localhost:8000</strong> et PAS file://</li>
                            <li>Le serveur HTTP est bien démarré : <code>python3 -m http.server 8000</code></li>
                            <li>Le fichier library_data/library.json existe et est valide</li>
                        </ul>
                        <p><strong>Commande pour rescanner:</strong> python3 scanner.py /chemin/vers/vos/livres</p>
                    </div>
                `;
            }
        }

        // Mettre à jour les statistiques
        function updateStats() {
            document.getElementById('total-books').textContent = library.total_books;

            const authors = new Set(library.books.map(book => book.author));
            document.getElementById('total-authors').textContent = authors.size;

            const scanDate = new Date(library.scan_date);
            document.getElementById('scan-date').textContent = scanDate.toLocaleDateString('fr-FR');
        }

        // Remplir les filtres
        function populateFilters() {
            // Auteurs - vider d'abord les options existantes
            const authorSelect = document.getElementById('author-filter');
            // Garder seulement la première option (Tous les auteurs)
            while (authorSelect.options.length > 1) {
                authorSelect.remove(1);
            }

            const authors = [...new Set(library.books.map(book => book.author))].sort();
            authors.forEach(author => {
                const option = document.createElement('option');
                option.value = author;
                option.textContent = author;
                authorSelect.appendChild(option);
            });

            // Catégories - vider d'abord les options existantes
            const categorySelect = document.getElementById('category-filter');
            while (categorySelect.options.length > 1) {
                categorySelect.remove(1);
            }

            const categories = new Set();
            library.books.forEach(book => {
                book.categories.forEach(cat => categories.add(cat));
            });
            [...categories].sort().forEach(category => {
                const option = document.createElement('option');
                option.value = category;
                option.textContent = category;
                categorySelect.appendChild(option);
            });

            // Mettre à jour le datalist pour l'autocomplétion
            updateCategoriesDatalist();
        }

        // Générer une couleur basée sur le nom de la catégorie
        function getCategoryColor(category) {
            // Créer un hash simple du nom de la catégorie
            let hash = 0;
            for (let i = 0; i < category.length; i++) {
                hash = category.charCodeAt(i) + ((hash << 5) - hash);
            }

            // Convertir en HSL pour des couleurs harmonieuses
            const hue = Math.abs(hash % 360);
            const saturation = 65 + (Math.abs(hash) % 20); // 65-85%
            const lightness = 45 + (Math.abs(hash >> 8) % 15); // 45-60%

            return `hsl(${hue}, ${saturation}%, ${lightness}%)`;
        }

        // Créer l'affichage des étoiles (lecture seule)
        function createStarDisplay(rating) {
            rating = rating || 0;
            let starsHtml = '<div class="star-rating-display">';
            for (let i = 1; i <= 5; i++) {
                const filled = i <= rating ? 'filled' : '';
                starsHtml += `<span class="star ${filled}">★</span>`;
            }
            starsHtml += '</div>';
            return starsHtml;
        }

        // Créer le composant de notation interactif
        function createStarRating(bookId, currentRating) {
            currentRating = currentRating || 0;
            let starsHtml = '<div class="star-rating" id="star-rating-' + bookId + '">';
            for (let i = 1; i <= 5; i++) {
                const filled = i <= currentRating ? 'filled' : '';
                starsHtml += `<span class="star ${filled}" data-rating="${i}" onclick="setRating('${bookId}', ${i})">★</span>`;
            }
            starsHtml += '</div>';
            return starsHtml;
        }

        // Modifier la note d'un livre
        function setRating(bookId, rating) {
            const book = library.books.find(b => b.id === bookId);
            if (!book) return;

            book.rating = rating;
            saveLibrary();

            // Rafraîchir l'affichage des étoiles dans la modal
            const ratingContainer = document.getElementById('star-rating-' + bookId);
            if (ratingContainer) {
                for (let i = 1; i <= 5; i++) {
                    const star = ratingContainer.querySelector(`[data-rating="${i}"]`);
                    if (star) {
                        if (i <= rating) {
                            star.classList.add('filled');
                        } else {
                            star.classList.remove('filled');
                        }
                    }
                }
            }

            // Rafraîchir l'affichage principal
            displayBooks();
        }

        // Mettre à jour le datalist pour l'autocomplétion des catégories
        function updateCategoriesDatalist() {
            const datalist = document.getElementById('categories-datalist');
            if (!datalist) {
                // Créer le datalist s'il n'existe pas
                const newDatalist = document.createElement('datalist');
                newDatalist.id = 'categories-datalist';
                document.body.appendChild(newDatalist);
            }

            const categories = new Set();
            library.books.forEach(book => {
                book.categories.forEach(cat => categories.add(cat));
            });

            const datalistElement = document.getElementById('categories-datalist');
            datalistElement.innerHTML = '';

            [...categories].sort().forEach(category => {
                const option = document.createElement('option');
                option.value = category;
                datalistElement.appendChild(option);
            });
        }

        // Afficher les livres
        function displayBooks() {
            if (currentView === 'categories') {
                displayCategoriesView();
                return;
            }

            const container = document.getElementById('books-display');
            container.className = currentView === 'grid' ? 'books-grid' : 'books-list';

            if (filteredBooks.length === 0) {
                container.innerHTML = `
                    <div class="no-books">
                        <h2>Aucun livre trouvé</h2>
                        <p>Essayez de modifier vos filtres de recherche</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filteredBooks.map(book => createBookCard(book)).join('');
        }

        // Afficher la vue des catégories
        function displayCategoriesView() {
            const container = document.getElementById('books-display');
            container.className = 'categories-grid';

            // Compter les livres par catégorie
            const categoriesCount = {};
            library.books.forEach(book => {
                book.categories.forEach(cat => {
                    if (!categoriesCount[cat]) {
                        categoriesCount[cat] = 0;
                    }
                    categoriesCount[cat]++;
                });
            });

            // Ajouter une catégorie "Sans catégorie"
            const booksWithoutCategory = library.books.filter(b => b.categories.length === 0).length;
            if (booksWithoutCategory > 0) {
                categoriesCount['Sans catégorie'] = booksWithoutCategory;
            }

            // Trier par nombre de livres (décroissant)
            const sortedCategories = Object.entries(categoriesCount).sort((a, b) => b[1] - a[1]);

            if (sortedCategories.length === 0) {
                container.innerHTML = `
                    <div class="no-books">
                        <h2>Aucune catégorie</h2>
                        <p>Commencez par ajouter des catégories à vos livres</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = sortedCategories.map(([category, count]) => `
                <div class="category-card" onclick="filterByCategory('${category.replace(/'/g, "\\'")}')">
                    <div class="category-color-bar" style="background: ${getCategoryColor(category)};"></div>
                    <div class="category-name">${category}</div>
                    <div class="category-count">${count} livre${count > 1 ? 's' : ''}</div>
                </div>
            `).join('');
        }

        // Filtrer par catégorie depuis la vue catégories
        function filterByCategory(category) {
            // Revenir à la vue grille
            currentView = 'grid';
            document.getElementById('grid-view').classList.add('active');
            document.getElementById('list-view').classList.remove('active');
            document.getElementById('categories-view').classList.remove('active');

            // Appliquer le filtre
            if (category === 'Sans catégorie') {
                document.getElementById('category-filter').value = '';
                filteredBooks = library.books.filter(book => book.categories.length === 0);
            } else {
                document.getElementById('category-filter').value = category;
                applyFilters();
            }

            displayBooks();
        }

        // Créer une carte de livre
        function createBookCard(book) {
            const coverHtml = book.cover
                ? `<img src="library_data/${book.cover}" alt="${book.title}">`
                : `<div style="font-size: 3em;">📖</div>`;

            const fileSize = formatFileSize(book.size);
            const pagesInfo = book.pages ? `${book.pages} pages` : 'ePub';

            const categoriesTags = book.categories.map(cat =>
                `<span class="category-tag" style="background: ${getCategoryColor(cat)};">${cat}</span>`
            ).join('');

            return `
                <div class="book-card" onclick="openBookModal('${book.id}')">
                    <div class="book-cover">${coverHtml}</div>
                    <div class="book-info">
                        <div class="book-title">${book.title}</div>
                        <div class="book-author">${book.author}</div>
                        ${createStarDisplay(book.rating || 0)}
                        <div class="book-meta">
                            <span>${book.type.toUpperCase()}</span>
                            <span>${pagesInfo}</span>
                            <span>${fileSize}</span>
                        </div>
                        <div class="book-categories">
                            ${categoriesTags}
                            ${book.categories.length === 0 ? '<button class="add-category-btn" onclick="event.stopPropagation(); openBookModal(\'' + book.id + '\')">+ Ajouter catégorie</button>' : ''}
                        </div>
                    </div>
                </div>
            `;
        }

        // Formater la taille de fichier
        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        // Ouvrir la modal de détails
        function openBookModal(bookId) {
            const book = library.books.find(b => b.id === bookId);
            if (!book) return;

            const modal = document.getElementById('book-modal');
            document.getElementById('modal-title').textContent = book.title;

            const coverHtml = book.cover
                ? `<img src="library_data/${book.cover}" alt="${book.title}">`
                : `<div class="book-cover"><div style="font-size: 4em;">📖</div></div>`;

            document.getElementById('modal-cover-container').innerHTML = coverHtml;

            const categoriesTags = book.categories.map((cat, idx) =>
                `<span class="category-tag" style="background: ${getCategoryColor(cat)};">${cat} <span style="cursor: pointer; margin-left: 5px;" onclick="removeCategory('${bookId}', ${idx})">×</span></span>`
            ).join('');

            document.getElementById('modal-info').innerHTML = `
                <p><strong>Auteur:</strong> ${book.author}</p>
                <p><strong>Type:</strong> ${book.type.toUpperCase()}</p>
                <p><strong>Pages:</strong> ${book.pages || 'N/A'}</p>
                <p><strong>Taille:</strong> ${formatFileSize(book.size)}</p>
                <p><strong>Fichier:</strong> ${book.filename}</p>
                <p><strong>Modifié:</strong> ${new Date(book.modified).toLocaleDateString('fr-FR')}</p>
                <p><strong>Note:</strong></p>
                ${createStarRating(bookId, book.rating || 0)}
                <p style="margin-top: 15px;"><strong>Catégories:</strong></p>
                <div class="book-categories" style="margin-bottom: 10px;">
                    ${categoriesTags}
                </div>
                <div class="category-input">
                    <input type="text" id="new-category-input" list="categories-datalist" placeholder="Ajouter une catégorie..." autocomplete="off">
                    <button onclick="addCategory('${bookId}')">Ajouter</button>
                </div>
                <div style="margin-top: 15px; display: flex; gap: 10px; flex-wrap: wrap;">
                    ${book.type === 'pdf' ? `<button onclick="openPdfInBrowser('${book.path.replace(/'/g, "\\'")}', '${book.title.replace(/'/g, "\\'")}')">
                        🌐 Ouvrir le PDF dans le navigateur
                    </button>` : ''}
                    <button onclick="copyPath('${book.path.replace(/'/g, "\\'")}')">
                        📋 Copier le chemin
                    </button>
                    <button onclick="showPathInstructions('${book.path.replace(/'/g, "\\'")}')" style="background: #f0f0f0; color: #666;">
                        📖 Voir les instructions
                    </button>
                    <button onclick="confirmDeleteBook('${bookId}')" style="background: #d32f2f; color: white;">
                        🗑️ Supprimer ce livre
                    </button>
                </div>
                <p id="copy-status" style="margin-top: 10px; font-size: 0.9em; color: #667eea; display: none;"></p>
            `;

            modal.classList.add('active');
        }

        // Fermer la modal
        function closeModal() {
            document.getElementById('book-modal').classList.remove('active');
        }

        // Ajouter une catégorie
        function addCategory(bookId) {
            const input = document.getElementById('new-category-input');
            const category = input.value.trim();

            if (!category) return;

            const book = library.books.find(b => b.id === bookId);
            if (!book.categories.includes(category)) {
                book.categories.push(category);
                saveLibrary();
                openBookModal(bookId); // Rafraîchir la modal
                displayBooks(); // Rafraîchir l'affichage
                populateFilters(); // Rafraîchir les filtres
            }

            input.value = '';
        }

        // Supprimer une catégorie
        function removeCategory(bookId, categoryIndex) {
            const book = library.books.find(b => b.id === bookId);
            book.categories.splice(categoryIndex, 1);
            saveLibrary();
            openBookModal(bookId);
            displayBooks();
            populateFilters();
        }

        // Confirmer et supprimer un livre
        function confirmDeleteBook(bookId) {
            const book = library.books.find(b => b.id === bookId);
            if (!book) return;

            const confirmed = confirm(
                `Êtes-vous sûr de vouloir supprimer ce livre de la bibliothèque ?\n\n` +
                `Titre: ${book.title}\n` +
                `Auteur: ${book.author}\n\n` +
                `Note: Le fichier physique ne sera pas supprimé, seulement l'entrée dans la bibliothèque.`
            );

            if (confirmed) {
                deleteBook(bookId);
            }
        }

        // Supprimer un livre de la bibliothèque
        function deleteBook(bookId) {
            const bookIndex = library.books.findIndex(b => b.id === bookId);
            if (bookIndex === -1) return;

            // Supprimer le livre de la liste
            library.books.splice(bookIndex, 1);
            library.total_books = library.books.length;

            // Mettre à jour filteredBooks
            const filteredIndex = filteredBooks.findIndex(b => b.id === bookId);
            if (filteredIndex !== -1) {
                filteredBooks.splice(filteredIndex, 1);
            }

            // Sauvegarder et rafraîchir
            saveLibrary();
            closeModal();
            updateStats();
            populateFilters();
            displayBooks();

            // Afficher un message de confirmation
            const status = document.getElementById('copy-status');
            if (status) {
                status.textContent = '✓ Livre supprimé de la bibliothèque';
                status.style.display = 'block';
                status.style.color = '#28a745';
                setTimeout(() => {
                    status.style.display = 'none';
                }, 3000);
            }
        }

        // Sauvegarder la bibliothèque
        function saveLibrary() {
            // Note: Dans un navigateur, on ne peut pas écrire directement dans un fichier
            // On utilise localStorage comme solution de contournement
            localStorage.setItem('library', JSON.stringify(library));
            console.log('Bibliothèque sauvegardée dans localStorage');

            // Afficher un rappel pour exporter
            showExportReminder();
        }

        // Afficher un rappel pour exporter les modifications
        function showExportReminder() {
            const reminderDiv = document.getElementById('export-reminder');
            if (reminderDiv) {
                reminderDiv.style.display = 'block';
                setTimeout(() => {
                    reminderDiv.style.opacity = '1';
                }, 100);
            }
        }

        // Exporter les catégories et notes modifiées
        function exportCategories() {
            const categoriesData = {
                export_date: new Date().toISOString(),
                books: library.books.map(book => ({
                    id: book.id,
                    title: book.title,
                    categories: book.categories,
                    rating: book.rating || 0
                }))
            };

            const blob = new Blob([JSON.stringify(categoriesData, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `categories_${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            // Cacher le rappel
            const reminderDiv = document.getElementById('export-reminder');
            if (reminderDiv) {
                reminderDiv.style.opacity = '0';
                setTimeout(() => {
                    reminderDiv.style.display = 'none';
                }, 300);
            }

            alert('✓ Catégories et notes exportées!\n\nMaintenant, lancez :\npython3 import_categories.py categories_XXXX-XX-XX.json');
        }

        // Ouvrir le PDF dans le navigateur
        function openPdfInBrowser(path, title) {
            // Essayer d'ouvrir avec file://
            const fileUrl = 'file://' + path;
            const newWindow = window.open(fileUrl, '_blank');

            // Afficher un message d'aide si nécessaire
            setTimeout(() => {
                const status = document.getElementById('copy-status');
                status.innerHTML = `
                    <strong>💡 Astuce :</strong> Si le PDF ne s'ouvre pas, c'est normal - les navigateurs bloquent file:// pour des raisons de sécurité.<br><br>
                    <strong>Solution :</strong> Copiez le chemin et ouvrez-le manuellement dans votre lecteur PDF préféré.
                `;
                status.style.display = 'block';
                status.style.color = '#666';
                setTimeout(() => {
                    status.style.display = 'none';
                }, 8000);
            }, 1000);
        }

        // Copier le chemin dans le presse-papier
        function copyPath(path) {
            navigator.clipboard.writeText(path).then(() => {
                const status = document.getElementById('copy-status');
                status.textContent = '✓ Chemin copié dans le presse-papier !';
                status.style.display = 'block';
                status.style.color = '#28a745';
                setTimeout(() => {
                    status.style.display = 'none';
                }, 3000);
            }).catch(err => {
                const status = document.getElementById('copy-status');
                status.textContent = '❌ Erreur lors de la copie. Chemin: ' + path;
                status.style.display = 'block';
                status.style.color = '#d32f2f';
            });
        }

        // Afficher les instructions pour ouvrir le livre
        function showPathInstructions(path) {
            const status = document.getElementById('copy-status');
            const isMac = navigator.platform.toUpperCase().indexOf('MAC') >= 0;
            const isWindows = navigator.platform.toUpperCase().indexOf('WIN') >= 0;

            let instructions = '<strong>Comment ouvrir le livre :</strong><br><br>';

            if (isMac) {
                instructions += '1. Copiez le chemin avec le bouton "📋 Copier"<br>';
                instructions += '2. Ouvrez Finder → Menu "Aller" → "Aller au dossier..." (Cmd+Shift+G)<br>';
                instructions += '3. Collez le chemin et appuyez sur Entrée<br><br>';
            } else if (isWindows) {
                instructions += '1. Copiez le chemin avec le bouton "📋 Copier"<br>';
                instructions += '2. Ouvrez l\'Explorateur de fichiers (Windows+E)<br>';
                instructions += '3. Collez le chemin dans la barre d\'adresse et appuyez sur Entrée<br><br>';
            } else {
                instructions += '1. Copiez le chemin avec le bouton "📋 Copier"<br>';
                instructions += '2. Ouvrez votre gestionnaire de fichiers<br>';
                instructions += '3. Naviguez vers le chemin copié<br><br>';
            }

            instructions += '<small style="color: #666;">Chemin: ' + path + '</small>';

            status.innerHTML = instructions;
            status.style.display = 'block';
            status.style.color = '#333';
            status.style.lineHeight = '1.6';
        }

        // Charger depuis localStorage si disponible
        function loadFromLocalStorage() {
            const saved = localStorage.getItem('library');
            if (saved) {
                try {
                    const savedLibrary = JSON.parse(saved);
                    // Fusionner les catégories et notes sauvegardées avec les données actuelles
                    if (library) {
                        library.books.forEach(book => {
                            const savedBook = savedLibrary.books.find(b => b.id === book.id);
                            if (savedBook) {
                                if (savedBook.categories) {
                                    book.categories = savedBook.categories;
                                }
                                if (savedBook.rating !== undefined) {
                                    book.rating = savedBook.rating;
                                }
                            }
                        });
                    }
                } catch (e) {
                    console.error('Erreur de chargement localStorage:', e);
                }
            }
        }

        // Recherche et filtrage
        function applyFilters() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const authorFilter = document.getElementById('author-filter').value;
            const categoryFilter = document.getElementById('category-filter').value;
            const typeFilter = document.getElementById('type-filter').value;
            const ratingFilter = document.getElementById('rating-filter').value;

            filteredBooks = library.books.filter(book => {
                const matchSearch = !searchTerm ||
                    book.title.toLowerCase().includes(searchTerm) ||
                    book.author.toLowerCase().includes(searchTerm) ||
                    book.filename.toLowerCase().includes(searchTerm);

                const matchAuthor = !authorFilter || book.author === authorFilter;
                const matchCategory = !categoryFilter || book.categories.includes(categoryFilter);
                const matchType = !typeFilter || book.type === typeFilter;

                // Filtre par note
                let matchRating = true;
                if (ratingFilter !== '') {
                    const filterValue = parseInt(ratingFilter);
                    const bookRating = book.rating || 0;

                    if (filterValue === 0) {
                        // "Sans note" - afficher seulement les livres non notés
                        matchRating = bookRating === 0;
                    } else {
                        // "X étoiles et plus" - afficher les livres avec au moins X étoiles
                        matchRating = bookRating >= filterValue;
                    }
                }

                return matchSearch && matchAuthor && matchCategory && matchType && matchRating;
            });

            displayBooks();
        }

        // Event listeners
        document.getElementById('search-input').addEventListener('input', applyFilters);
        document.getElementById('author-filter').addEventListener('change', applyFilters);
        document.getElementById('category-filter').addEventListener('change', applyFilters);
        document.getElementById('type-filter').addEventListener('change', applyFilters);
        document.getElementById('rating-filter').addEventListener('change', applyFilters);

        document.getElementById('grid-view').addEventListener('click', () => {
            currentView = 'grid';
            document.getElementById('grid-view').classList.add('active');
            document.getElementById('list-view').classList.remove('active');
            displayBooks();
        });

        document.getElementById('list-view').addEventListener('click', () => {
            currentView = 'list';
            document.getElementById('list-view').classList.add('active');
            document.getElementById('grid-view').classList.remove('active');
            document.getElementById('categories-view').classList.remove('active');
            displayBooks();
        });

        document.getElementById('categories-view').addEventListener('click', () => {
            currentView = 'categories';
            document.getElementById('categories-view').classList.add('active');
            document.getElementById('grid-view').classList.remove('active');
            document.getElementById('list-view').classList.remove('active');
            displayBooks();
        });

        // Fermer la modal en cliquant à l'extérieur
        document.getElementById('book-modal').addEventListener('click', (e) => {
            if (e.target.id === 'book-modal') {
                closeModal();
            }
        });

        // Fermer la modal avec la touche Escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' || e.key === 'Esc') {
                const modal = document.getElementById('book-modal');
                if (modal.classList.contains('active')) {
                    closeModal();
                }
            }
        });

        // Charger la bibliothèque au démarrage
        loadLibrary().then(() => {
            loadFromLocalStorage();
            populateFilters(); // Rappeler pour inclure les catégories du localStorage
            displayBooks();
        });
    </script>
</body>
</html>
